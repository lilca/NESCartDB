
name: Create Database

on:
  workflow_dispatch: # Actionsタブから手動で実行できるようにする設定

jobs:
  create-db:
    runs-on: ubuntu-latest

    # db/ ディレクトリへの変更を自動コミット・プッシュするための権限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          #cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml

      - name: Run SQLite creation script
        run: |
          python src/create_sqlite.py

      - name: Commit and push changes to db/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add db/
          # 変更がある場合のみコミット＆プッシュを実行
          git diff --staged --quiet || git commit -m "Auto-update SQLite database [skip ci]"
          git push
