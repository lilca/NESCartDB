<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NESCartDB Viewer</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- sql.js (WebAssembly) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold mb-2">🎮 NESCartDB Viewer(開発中)</h1>
            <p class="text-slate-400">SQLiteデータベースの閲覧・複数テーブル検索ツール</p>
        </header>

        <!-- コントロールエリア -->
        <div class="mb-6 flex gap-4 flex-wrap items-center">
            <!-- テーブル一覧選択セレクトボックス -->
            <select id="tableSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                <option value="">-- テーブルを選択 --</option>
            </select>

            <input type="text" id="searchInput" placeholder="選択中のテーブルをキーワード検索..." 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 min-w-[200px]" disabled>
            
            <!-- 1ページあたりの表示件数 -->
            <select id="pageSizeSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                <option value="25">25件表示</option>
                <option value="50">50件表示</option>
                <option value="100" selected>100件表示</option>
            </select>

            <!-- ページ移動のインクリメント（スキップ幅）選択 -->
            <select id="incrementSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                <option value="1" selected>移動幅: 1ページ</option>
                <option value="5">移動幅: 5ページ</option>
                <option value="10">移動幅: 10ページ</option>
                <option value="100">移動幅: 100ページ</option>
            </select>

            <button id="loadBtn" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg font-semibold transition">
                DB再読み込み
            </button>
        </div>

        <!-- ステータス・ヒット件数表示 -->
        <div id="status" class="text-sm text-slate-400 mb-4">「DB再読み込み」ボタンを押してデータをロードしてください。</div>

        <!-- テーブル表示エリア -->
        <div class="bg-slate-800 rounded-lg shadow overflow-x-auto border border-slate-700 mb-4">
            <table class="w-full text-left border-collapse" id="resultTable">
                <thead id="tableHead" class="bg-slate-700 text-slate-300 uppercase text-xs"></thead>
                <tbody id="tableBody" class="divide-y divide-slate-700 text-sm"></tbody>
            </table>
        </div>

        <!-- ページネーションコントロール -->
        <div id="pagination" class="flex justify-between items-center mb-8 bg-slate-800/50 border border-slate-700 rounded-lg px-6 py-3">
            <button id="prevBtn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-semibold transition disabled:opacity-30 disabled:cursor-not-allowed" disabled>
                ◀ 戻る
            </button>
            <span id="pageInfo" class="text-sm text-slate-300">0 / 0 ページ (全 0 件)</span>
            <button id="nextBtn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-semibold transition disabled:opacity-30 disabled:cursor-not-allowed" disabled>
                進む ▶
            </button>
        </div>

        <!-- 使い方セクション -->
        <div class="bg-slate-800/50 border border-slate-700 rounded-lg p-6">
            <h2 class="text-xl font-bold mb-3 text-slate-200">📖 使い方ガイド</h2>
            <ol class="list-decimal list-inside space-y-3 text-slate-300 text-sm">
                <li><strong class="text-indigo-400">移動幅（インクリメント）の選択:</strong> 上部のセレクトボックスで「1・5・10・100ページ」の移動幅を切り替えられます。</li>
                <li><strong class="text-indigo-400">範囲外ガード:</strong> 指定した移動幅分を進むと最大ページを超える場合、または戻ると1ページ目を割る場合は、自動的にボタンが無効化されます。</li>
            </ol>
        </div>
    </div>

    <script>
        let db = null;
        let currentTable = "";
        let currentPage = 1;
        let pageSize = 100;
        let increment = 1;
        let totalRows = 0;

        async function initDB() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = "データベースをダウンロード中...";

            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });

                const response = await fetch('db/nes_games.db');
                if (!response.ok) throw new Error("データベースファイルが見つかりません。");
                
                const buffer = await response.arrayBuffer();
                db = new SQL.Database(new Uint8Array(buffer));

                statusEl.textContent = "データベースの読み込みが完了しました。テーブルを選択してください。";
                loadTableList();
            } catch (err) {
                statusEl.textContent = "エラー: " + err.message;
                console.error(err);
            }
        }

        function loadTableList() {
            if (!db) return;

            const selectEl = document.getElementById('tableSelect');
            selectEl.innerHTML = '<option value="">-- テーブルを選択 --</option>';

            try {
                const stmt = db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';");
                const tables = [];
                while (stmt.step()) {
                    tables.push(stmt.get()[0]);
                }
                stmt.free();

                tables.forEach(tableName => {
                    const opt = document.createElement('option');
                    opt.value = tableName;
                    opt.textContent = tableName;
                    selectEl.appendChild(opt);
                });

                if (tables.length > 0) {
                    selectEl.value = tables[0];
                    currentTable = tables[0];
                    currentPage = 1;
                    document.getElementById('searchInput').disabled = false;
                    queryData();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function queryData() {
            if (!db || !currentTable) return;

            const keyword = document.getElementById('searchInput').value.trim();

            try {
                const colStmt = db.prepare(`PRAGMA table_info("${currentTable}");`);
                const columnNames = [];
                while (colStmt.step()) {
                    columnNames.push(colStmt.get()[1]);
                }
                colStmt.free();

                let whereClause = "";
                let params = [];
                let countParams = [];

                if (keyword && columnNames.length > 0) {
                    const conditions = columnNames.map(col => `"${col}" LIKE ?`).join(" OR ");
                    whereClause = ` WHERE ${conditions}`;
                    const likeKeyword = `%${keyword}%`;
                    params = columnNames.map(() => likeKeyword);
                    countParams = [...params];
                }

                const countQuery = `SELECT COUNT(*) FROM "${currentTable}"${whereClause};`;
                const countStmt = db.prepare(countQuery);
                countStmt.bind(countParams);
                if (countStmt.step()) {
                    totalRows = countStmt.get()[0];
                }
                countStmt.free();

                const totalPages = Math.ceil(totalRows / pageSize) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const offset = (currentPage - 1) * pageSize;

                let query = `SELECT * FROM "${currentTable}"${whereClause} LIMIT ? OFFSET ?;`;
                params.push(pageSize);
                params.push(offset);

                const stmt = db.prepare(query);
                stmt.bind(params);

                const rows = [];
                while (stmt.step()) {
                    rows.push(stmt.get());
                }
                stmt.free();

                renderTable(columnNames, rows);
                updatePaginationUI(totalPages);

                const startCount = totalRows === 0 ? 0 : offset + 1;
                const endCount = offset + rows.length;
                document.getElementById('status').textContent = 
                    `テーブル「${currentTable}」を検索中 — 全 ${totalRows} 件中 (${startCount} 〜 ${endCount} 件目を表示)`;

            } catch (err) {
                console.error(err);
                document.getElementById('status').textContent = "クエリ実行エラー: " + err.message;
            }
        }

        function renderTable(columns, rows) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');

            thead.innerHTML = `<tr>${columns.map(col => `<th class="px-6 py-3">${col}</th>`).join('')}</tr>`;
            
            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${columns.length}" class="px-6 py-4 text-center text-slate-400">データが見つかりません</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.map(row => 
                `<tr class="hover:bg-slate-700/50">${row.map(val => `<td class="px-6 py-4">${val !== null ? val : ''}</td>`).join('')}</tr>`
            ).join('');
        }

        function updatePaginationUI(totalPages) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');

            pageInfo.textContent = `${currentPage} / ${totalPages} ページ (全 ${totalRows} 件)`;

            // 範囲外を超える場合はボタンを押せないようにする制御
            prevBtn.disabled = (currentPage - increment < 1);
            nextBtn.disabled = (currentPage + increment > totalPages);
        }

        // --- イベントリスナー ---
        document.getElementById('loadBtn').addEventListener('click', () => {
            currentPage = 1;
            initDB();
        });
        
        document.getElementById('tableSelect').addEventListener('change', (e) => {
            currentTable = e.target.value;
            currentPage = 1;
            const searchInput = document.getElementById('searchInput');
            if (currentTable) {
                searchInput.disabled = false;
                searchInput.value = "";
                queryData();
            } else {
                searchInput.disabled = true;
                document.getElementById('tableHead').innerHTML = "";
                document.getElementById('tableBody').innerHTML = "";
                document.getElementById('status').textContent = "テーブルを選択してください。";
                updatePaginationUI(1);
            }
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1;
            queryData();
        });

        document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
            pageSize = parseInt(e.target.value, 10);
            currentPage = 1;
            queryData();
        });

        // ページ移動インクリメント（スキップ幅）変更時
        document.getElementById('incrementSelect').addEventListener('change', (e) => {
            increment = parseInt(e.target.value, 10);
            const totalPages = Math.ceil(totalRows / pageSize) || 1;
            updatePaginationUI(totalPages);
        });

        // インクリメント分移動するボタン
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage - increment >= 1) {
                currentPage -= increment;
                queryData();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(totalRows / pageSize) || 1;
            if (currentPage + increment <= totalPages) {
                currentPage += increment;
                queryData();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        initDB();
    </script>
</body>
</html>
